<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" role="img" aria-label="Divider with a spider walking along a thread" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="thread" x1="0" x2="1">
      <stop offset="0" stop-color="#7c5cd6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="spider">
      <g stroke="#e9d5ff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="0.4s" repeatCount="indefinite"/>
          <path d="M6,-3 L10,-9 L14,-10"/><path d="M3,-4 L4,-11 L2,-14"/><path d="M0,-4 L-5,-11 L-9,-12"/><path d="M-3,-3 L-10,-8 L-14,-6"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="6 0 0;-6 0 0;6 0 0" dur="0.4s" repeatCount="indefinite"/>
          <path d="M6,3 L10,9 L14,10"/><path d="M3,4 L4,11 L2,14"/><path d="M0,4 L-5,11 L-9,12"/><path d="M-3,3 L-10,8 L-14,6"/>
        </g>
      </g>
      <ellipse cx="-4" cy="0" rx="8" ry="5.5" fill="#1a0b2e" stroke="#a78bfa" stroke-width="1.2"/>
      <circle cx="6" cy="0" r="3.8" fill="#1a0b2e" stroke="#a78bfa" stroke-width="1.2"/>
      <circle cx="8.6" cy="-1.3" r="0.9" fill="#ef4444"/>
      <circle cx="8.6" cy="1.3" r="0.9" fill="#ef4444"/>
    </g>
  </defs>

  <line x1="0" y1="30" x2="900" y2="30" stroke="url(#thread)" stroke-width="1.2"/>
  <g filter="url(#glow)">
    <circle cx="150" cy="30" r="3" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="30" r="3.5" fill="#f0abfc"><animate attributeName="r" values="2.5;5;2.5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="30" r="3" fill="#ef4444"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g filter="url(#glow)">
    <g>
      <animateMotion dur="18s" repeatCount="indefinite" rotate="auto" path="M40,30 L860,30 L40,30"/>
      <g transform="scale(0.8)"><use href="#spider"/></g>
    </g>
  </g>
</svg>
