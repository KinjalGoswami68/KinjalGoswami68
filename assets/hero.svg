<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Kinjal - AI/ML engineer. An animated spider crawls a glowing web." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="80%" cy="22%" r="95%">
      <stop offset="0" stop-color="#2a0f3f"/>
      <stop offset="0.45" stop-color="#0d0618"/>
      <stop offset="1" stop-color="#030208"/>
    </radialGradient>
    <linearGradient id="ttl" x1="0" x2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="0.6" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="900" height="320" rx="14"/></clipPath>

    <!-- spider drawn facing +x so rotate="auto" points it along its path -->
    <g id="spider">
      <g stroke="#e9d5ff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="0.4s" repeatCount="indefinite"/>
          <path d="M6,-3 L10,-9 L14,-10"/>
          <path d="M3,-4 L4,-11 L2,-14"/>
          <path d="M0,-4 L-5,-11 L-9,-12"/>
          <path d="M-3,-3 L-10,-8 L-14,-6"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="6 0 0;-6 0 0;6 0 0" dur="0.4s" repeatCount="indefinite"/>
          <path d="M6,3 L10,9 L14,10"/>
          <path d="M3,4 L4,11 L2,14"/>
          <path d="M0,4 L-5,11 L-9,12"/>
          <path d="M-3,3 L-10,8 L-14,6"/>
        </g>
      </g>
      <ellipse cx="-4" cy="0" rx="8" ry="5.5" fill="#1a0b2e" stroke="#a78bfa" stroke-width="1.2"/>
      <circle cx="6" cy="0" r="3.8" fill="#1a0b2e" stroke="#a78bfa" stroke-width="1.2"/>
      <circle cx="8.6" cy="-1.3" r="0.9" fill="#ef4444"/>
      <circle cx="8.6" cy="1.3" r="0.9" fill="#ef4444"/>
      <path d="M-8,-2 L-2,0 L-8,2" stroke="#dc2626" stroke-width="1" fill="none"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="320" fill="url(#bg)"/>

    <!-- web: radial threads from hub (720,70) -->
    <g stroke="#7c5cd6" stroke-width="0.8" opacity="0.55" fill="none">
      <path d="M720,70 L1050,70"/>
      <path d="M720,70 L1006,235"/>
      <path d="M720,70 L885,356"/>
      <path d="M720,70 L720,400"/>
      <path d="M720,70 L555,356"/>
      <path d="M720,70 L434,235"/>
      <path d="M720,70 L390,70"/>
      <!-- rings -->
      <path d="M780,70 L772,100 L750,122 L720,130 L690,122 L668,100 L660,70"/>
      <path d="M840,70 L824,130 L780,174 L720,190 L660,174 L616,130 L600,70"/>
      <path d="M900,70 L876,160 L810,226 L720,250 L630,226 L564,160 L540,70"/>
      <path d="M960,70 L928,190 L840,278 L720,310 L600,278 L512,190 L480,70"/>
      <path d="M1020,70 L980,220 L870,330 L720,370 L570,330 L460,220 L420,70"/>
    </g>

    <!-- pulsing nodes -->
    <g filter="url(#glow)">
      <circle cx="720" cy="70" r="4" fill="#f0abfc"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="772" cy="100" r="3" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="824" cy="130" r="3" fill="#ef4444"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="190" r="3.5" fill="#60a5fa"><animate attributeName="r" values="2.5;5;2.5" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="174" r="3" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="630" cy="226" r="3" fill="#ef4444"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="226" r="3" fill="#60a5fa"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="250" r="3.5" fill="#f0abfc"><animate attributeName="r" values="2.5;5;2.5" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="564" cy="160" r="3" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- data packets travelling out along threads -->
    <g filter="url(#glow)" fill="#fbcfe8">
      <circle r="2.4"><animateMotion dur="3.2s" repeatCount="indefinite" path="M720,70 L885,356"/></circle>
      <circle r="2.4"><animateMotion dur="4.1s" begin="0.8s" repeatCount="indefinite" path="M720,70 L555,356"/></circle>
      <circle r="2.4"><animateMotion dur="3.6s" begin="1.6s" repeatCount="indefinite" path="M720,70 L1006,235"/></circle>
      <circle r="2.4"><animateMotion dur="4.4s" begin="2.2s" repeatCount="indefinite" path="M720,70 L434,235"/></circle>
    </g>

    <!-- crawling spider: loops along the web threads -->
    <g filter="url(#glow)">
      <g>
        <animateMotion dur="16s" repeatCount="indefinite" rotate="auto"
          path="M720,190 L660,174 L616,130 L600,70 L540,70 L564,160 L630,226 L720,250 L810,226 L876,160 L900,70 L840,70 L824,130 L780,174 Z"/>
        <g transform="scale(1.15)"><use href="#spider"/></g>
      </g>
    </g>

    <!-- hanging spider dropping on a thread -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 60;0 112;0 60" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <line x1="462" y1="-400" x2="462" y2="0" stroke="#a78bfa" stroke-width="0.9" opacity="0.8"/>
      <g transform="translate(462,10) rotate(90) scale(1.1)" filter="url(#glow)"><use href="#spider"/></g>
    </g>

    <!-- text -->
    <text x="40" y="132" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="62" font-weight="700" letter-spacing="6" fill="url(#ttl)" filter="url(#glow)">KINJAL
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="42" y="178" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#a78bfa">AI / ML ENGINEER</text>
    <text x="42" y="212" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">$ crawl --target LLMs RAG agents backend<tspan fill="#dc2626">_<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></tspan></text>
    <text x="42" y="240" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#6b7280">[ok] spider online. web expanding.</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="319" rx="14" fill="none" stroke="#2a1a4a"/>
</svg>
